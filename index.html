<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Map Tool</title>
  
  <!-- CSS Reset & Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS Play CDN (perfectly compiles all styling classes) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- React 18 CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel compiler CDN (runs in browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- LZ-String compression CDN (decompress shared cloud strings) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Custom CSS animations matching Motion */
    @keyframes slideDownIn {
      0% { opacity: 0; transform: translate(-50%, -20px); }
      100% { opacity: 1; transform: translate(-50%, 0); }
    }
    @keyframes slideUpIn {
      0% { opacity: 0; transform: translate(-50%, 10px); }
      100% { opacity: 1; transform: translate(-50%, 0); }
    }
    .animate-toast {
      animation: slideDownIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-guide {
      animation: slideUpIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    body {
      touch-action: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React App using Babel JSX compilation -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    
    // Custom wrapper for Lucide Icons in standalone browser HTML environment
    const Icon = ({ name, size = 18, className = "", ...props }) => {
      const [svgContent, setSvgContent] = useState("");
      
      useEffect(() => {
        if (window.lucide && window.lucide.icons) {
          const camelName = name.replace(/-([a-z])/g, (g) => g[1].toUpperCase());
          const icon = window.lucide.icons[name] || window.lucide.icons[camelName];
          if (icon) {
            // Reconstruct the inner HTML of the SVG
            const inner = icon[2].map(([tag, attrs]) => {
              const attrStr = Object.entries(attrs).map(([k, v]) => `${k}="${v}"`).join(" ");
              return `<${tag} ${attrStr} />`;
            }).join("");
            setSvgContent(inner);
          }
        }
      }, [name]);

      const camelName = name.replace(/-([a-z])/g, (g) => g[1].toUpperCase());
      const icon = window.lucide && window.lucide.icons ? (window.lucide.icons[name] || window.lucide.icons[camelName]) : null;
      const defaultAttrs = icon ? icon[1] : {
        xmlns: "http://www.w3.org/2000/svg",
        width: "24",
        height: "24",
        viewBox: "0 0 24 24",
        fill: "none",
        stroke: "currentColor",
        strokeWidth: "2",
        strokeLinecap: "round",
        strokeLinejoin: "round"
      };

      return (
        <svg
          {...defaultAttrs}
          width={size}
          height={size}
          className={`lucide lucide-${name} ${className}`}
          {...props}
          dangerouslySetInnerHTML={{ __html: svgContent }}
        />
      );
    };

    // Custom individual icon components
    const Camera = (props) => <Icon name="camera" {...props} />;
    const MapPin = (props) => <Icon name="map-pin" {...props} />;
    const Plus = (props) => <Icon name="plus" {...props} />;
    const Trash2 = (props) => <Icon name="trash-2" {...props} />;
    const RotateCcw = (props) => <Icon name="rotate-ccw" {...props} />;
    const Maximize2 = (props) => <Icon name="maximize-2" {...props} />;
    const SlidersHorizontal = (props) => <Icon name="sliders" {...props} />;
    const Lock = (props) => <Icon name="lock" {...props} />;
    const Unlock = (props) => <Icon name="unlock" {...props} />;
    const Users = (props) => <Icon name="users" {...props} />;
    const Save = (props) => <Icon name="save" {...props} />;
    const HelpCircle = (props) => <Icon name="help-circle" {...props} />;
    const Copy = (props) => <Icon name="copy" {...props} />;
    const Check = (props) => <Icon name="check" {...props} />;
    const Eye = (props) => <Icon name="eye" {...props} />;
    const Grid = (props) => <Icon name="grid" {...props} />;
    const ChevronUp = (props) => <Icon name="chevron-up" {...props} />;
    const ChevronDown = (props) => <Icon name="chevron-down" {...props} />;
    const ChevronLeft = (props) => <Icon name="chevron-left" {...props} />;
    const ChevronRight = (props) => <Icon name="chevron-right" {...props} />;
    const Move = (props) => <Icon name="move" {...props} />;
    const PenTool = (props) => <Icon name="pen-tool" {...props} />;
    const Eraser = (props) => <Icon name="eraser" {...props} />;
    const FileImage = (props) => <Icon name="file-image" {...props} />;
    const Upload = (props) => <Icon name="upload" {...props} />;
    const X = (props) => <Icon name="x" {...props} />;

    // API GAS Endpoint configuration
    const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbzQOcpj6K247JSfRYxy40hHzCiTPt5MYEbvNKT6S33KZ3Ncp1XzzOXkePn4rAMuki0Y/exec";

    const T_W = 64;
    const T_H = 32;

    const PRESETS = [
      { name: "HQ", url: "https://raw.githubusercontent.com/orihina0193/map-tool/main/img/HQ.png", s: 1.6, o: 1, gw: 2, gh: 2, ox: -0.1, oy: -0.2 },
      { name: "DOOM", url: "https://raw.githubusercontent.com/orihina0193/map-tool/main/img/DOOM.png", s: 1.6, o: -3, gw: 2, gh: 2, ox: -0.2, oy: 0 },
      { name: "MED", url: "https://raw.githubusercontent.com/orihina0193/map-tool/main/img/MED.png", s: 1.6, o: -1, gw: 2, gh: 2, ox: -0.1, oy: -0.1 },
      { name: "SRG", url: "https://raw.githubusercontent.com/orihina0193/map-tool/main/img/SRG.png", s: 1.7, o: -3, gw: 2, gh: 2, ox: -0.1, oy: -0.1 },
      { name: "RSS", url: "https://raw.githubusercontent.com/orihina0193/map-tool/main/img/RSS.png", s: 1.6, o: -4, gw: 2, gh: 2, ox: -0.2, oy: -0.3 },
      { name: "ST", url: "https://raw.githubusercontent.com/orihina0193/map-tool/main/img/ST.png", s: 1.6, o: 0, gw: 2, gh: 2, ox: -0.2, oy: -0.2 },
      { name: "OP", url: "https://raw.githubusercontent.com/orihina0193/map-tool/main/img/OP.png", s: 0.8, o: 0, gw: 1, gh: 1, ox: -0.1, oy: -0.1 },
      { name: "tile", url: "https://raw.githubusercontent.com/orihina0193/map-tool/main/img/tile.png", s: 1.6, o: 1, gw: 2, gh: 2, ox: -0.1, oy: -0.2 },
      { name: "ROCK2", url: "https://raw.githubusercontent.com/orihina0193/map-tool/main/img/ROCK2.png", s: 0.75, o: -5, gw: 1, gh: 1, ox: 0, oy: 0 }
    ];

    function App() {
      const [currentRoomName, setCurrentRoomName] = useState(null);
      const [guideMode, setGuideMode] = useState(false);
      const [guideText, setGuideText] = useState("ガイドモード：ボタンをタップして説明を表示");
      const [isEditLocked, setIsEditLocked] = useState(false);
      const [mode, setMode] = useState("move");
      
      // 新しい「座標登録モード」
      const [isCoordSettingMode, setIsCoordSettingMode] = useState(false);
      const [coordMapping, setCoordMapping] = useState({
        refGx: 0,
        refGy: 0,
        x0: 100,
        y0: 100,
        x1: 101,
        y1: 100,
        x2: 100,
        y2: 101,
        isValid: false
      });
      
      // 座標基準点入力用のstate
      const [coordInput, setCoordInput] = useState({
        aX: "100", aY: "100",
        bX: "101", bY: "100",
        cX: "100", cY: "101"
      });

      // タップ/クリックされた現在のマス座標（X:Y コピー用等）
      const [selectedGrid, setSelectedGrid] = useState(null);
      const [copiedNotification, setCopiedNotification] = useState(null);

      // ステート群
      const [assets, setAssets] = useState([]);
      const [map, setMap] = useState([]);
      const [lines, setLines] = useState([]);
      const [selIdx, setSelIdx] = useState(-1);
      const [activeAsset, setActiveAsset] = useState(-1);
      const [tempAssetStore, setTempAssetStore] = useState(-1);
      const [syncStatus, setSyncStatus] = useState(null);
      const [clearClickCount, setClearClickCount] = useState(0);
      const [isBotPanelCollapsed, setIsBotPanelCollapsed] = useState(false);

      // オーバーレイ / モーダル
      const [showMemOverlay, setShowMemOverlay] = useState(false);
      const [showAssetOverlay, setShowAssetOverlay] = useState(false);
      const [exportImageUrl, setExportImageUrl] = useState(null);

      // キャンバス / カメラ Ref
      const canvasRef = useRef(null);
      const camRef = useRef({ x: 0, y: 0, z: 1 });
      const dragRef = useRef(false);
      const pinchRef = useRef(false);
      const lockedIdRef = useRef(null);
      const penStartRef = useRef(null);
      const penCurrentRef = useRef(null);
      const lastTRef = useRef({ x: 0, y: 0 });
      const lastDistRef = useRef(0);

      // 座標登録モードでのL字ドラッグ用
      const isDraggingCoordRef = useRef(false);

      // コピー文字列
      const showToast = (msg) => {
        setCopiedNotification(msg);
        setTimeout(() => setCopiedNotification(null), 2500);
      };

      // 画像のクロップ処理
      const cropImage = (img) => {
        const c = document.createElement("canvas");
        const t = c.getContext("2d");
        if (!t) return img.src;
        c.width = img.width;
        c.height = img.height;
        t.drawImage(img, 0, 0);
        const d = t.getImageData(0, 0, c.width, c.height).data;
        let x1 = c.width, y1 = c.height, x2 = 0, y2 = 0;
        for (let y = 0; y < c.height; y++) {
          for (let x = 0; x < c.width; x++) {
            if (d[(y * c.width + x) * 4 + 3] > 10) {
              x1 = Math.min(x1, x);
              y1 = Math.min(y1, y);
              x2 = Math.max(x2, x);
              y2 = Math.max(y2, y);
            }
          }
        }
        const w = x2 - x1 + 1;
        const h = y2 - y1 + 1;
        if (w <= 0 || h <= 0) return img.src;

        const c2 = document.createElement("canvas");
        c2.width = w;
        c2.height = h;
        const t2 = c2.getContext("2d");
        if (!t2) return img.src;
        t2.drawImage(img, x1, y1, w, h, 0, 0, w, h);
        return c2.toDataURL();
      };

      // 座標変換用の計算機 (等角グリッド gx, gy からゲーム内 X, Y を算出)
      const getGameCoords = (gx, gy) => {
        if (!coordMapping.isValid) return null;
        const gX = Math.round(gx);
        const gY = Math.round(gy);
        
        // Aからの相対的な位置
        const dx = gX - coordMapping.refGx;
        const dy = gY - coordMapping.refGy;

        // 定義された3点から線形補間 (アフィンマッパー)
        const X = coordMapping.x0 + dx * (coordMapping.x1 - coordMapping.x0) + dy * (coordMapping.x2 - coordMapping.x0);
        const Y = coordMapping.y0 + dx * (coordMapping.y1 - coordMapping.y0) + dy * (coordMapping.y2 - coordMapping.y0);

        return { x: Math.round(X), y: Math.round(Y) };
      };

      // ガイド表示切り替え
      const toggleGuideMode = () => {
        setGuideMode(!guideMode);
        if (!guideMode) {
          setGuideText("ガイドモード：ボタンをタップして説明を表示");
        } else {
          setSelectedGrid(null);
        }
      };

      const handleGuideClick = (key, e) => {
        if (!guideMode) return false;
        e.stopPropagation();
        e.preventDefault();
        const GUIDE_TEXT_MAP = {
          '選択解除': '選択中の建物を解除します。',
          'ギルメン名': '配置した建物に名前を付けます。',
          '名簿': '配置済みのメンバーを一覧表示し、タップするとその位置へジャンプします。',
          '素材追加': 'タップすると、新しい建物アセットを選択または独自の画像を登録できます。',
          'リセット': '全体をクリーンにリセットします。',
          'サイズ調整': 'スライダーで選択中の建物のサイズを変更します。',
          '接地調整': '前後関係や等角投影グリッドとの重なり順を調整します。',
          '微調整': '配置された建物のアンカー位置を十字ボタンで細かく調整します。',
          '画像保存': '現在の配置図を白背景の1枚の画像として生成・ダウンロード保存します。',
          '全消去': '配置したすべてのオブジェクト・赤線を消去します。',
          'モード切替': '移動、ペンでのルート描画、赤線消去、建物消去を選択します。',
          '座標登録': '座標登録モードに入ります。作業エリアが暗くなり、赤く並んだ3マスの基準点(L字)が現れます。このL字基準点をドラッグして好きな場所に配置し、それぞれの箇所のゲーム内座標(X:Y)を入力して登録します。'
        };
        setGuideText(GUIDE_TEXT_MAP[key] || "ガイド説明があります。");
        return true;
      };

      // 編集ロック
      const toggleEditLock = () => {
        if (isEditLocked) {
          if (!confirm("閲覧モードを解除しますか？")) return;
        }
        setIsEditLocked(!isEditLocked);
        if (!isEditLocked) {
          setSelIdx(-1);
          lockedIdRef.current = null;
          setActiveAsset(-1);
        }
      };

      // URLパラメータとデータの初回ロード
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const room = params.get("room");
        if (room) {
          setCurrentRoomName(room);
        }

        // 座標マッピングデータの初期化ロード
        const savedMapping = localStorage.getItem("coord_mapping_v1");
        if (savedMapping) {
          try {
            const parsed = JSON.parse(savedMapping);
            setCoordMapping(parsed);
            setCoordInput({
              aX: parsed.x0.toString(), aY: parsed.y0.toString(),
              bX: parsed.x1.toString(), bY: parsed.y1.toString(),
              cX: parsed.x2.toString(), cY: parsed.y2.toString()
            });
          } catch (e) {
            console.error("Failed to load layout map coordinates:", e);
          }
        }

        // プリセットアセットのロード＆クロップ
        loadPresetsAssets();
      }, []);

      // クラウドまたはローカルからの読込
      useEffect(() => {
        if (currentRoomName) {
          loadFromCloud(currentRoomName);
        } else {
          loadLocalData();
        }
      }, [currentRoomName]);

      const showStatus = (text, color, autoHideDelay = 3000) => {
        setSyncStatus({ text, color });
        if (autoHideDelay > 0) {
          setTimeout(() => {
            setSyncStatus(null);
          }, autoHideDelay);
        }
      };

      // プリセットロード
      const loadPresetsAssets = async () => {
        const loadedAssets = [];
        const hasBackend = window.location.hostname.endsWith("run.app") || window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";

        for (const p of PRESETS) {
          await new Promise((resolve) => {
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = () => {
              const src = cropImage(img);
              const i2 = new Image();
              i2.onload = () => {
                loadedAssets.push({
                  img: i2,
                  src,
                  name: p.name,
                  defS: p.s,
                  defO: p.o,
                  gw: p.gw,
                  gh: p.gh,
                  ox: p.ox,
                  oy: p.oy
                });
                resolve();
              };
              i2.src = src;
            };

            img.onerror = () => {
              // Direct github fallback
              const directImg = new Image();
              directImg.crossOrigin = "anonymous";
              directImg.onload = () => {
                const src = cropImage(directImg);
                const i2 = new Image();
                i2.onload = () => {
                  loadedAssets.push({
                    img: i2,
                    src,
                    name: p.name,
                    defS: p.s,
                    defO: p.o,
                    gw: p.gw,
                    gh: p.gh,
                    ox: p.ox,
                    oy: p.oy
                  });
                  resolve();
                };
                i2.src = src;
              };

              directImg.onerror = () => {
                // Local fallback (in same directory)
                const localImg = new Image();
                localImg.onload = () => {
                  const src = cropImage(localImg);
                  const i2 = new Image();
                  i2.onload = () => {
                    loadedAssets.push({
                      img: i2,
                      src,
                      name: p.name,
                      defS: p.s,
                      defO: p.o,
                      gw: p.gw,
                      gh: p.gh,
                      ox: p.ox,
                      oy: p.oy
                    });
                    resolve();
                  };
                  i2.src = src;
                };
                localImg.onerror = () => resolve();
                const relativePath = p.url.includes("img/") ? p.url.slice(p.url.indexOf("img/")) : p.url;
                localImg.src = relativePath;
              };
              directImg.src = p.url;
            };

            if (hasBackend) {
              img.src = '/api/proxy-image?url=' + encodeURIComponent(p.url);
            } else {
              const relativePath = p.url.includes("img/") ? p.url.slice(p.url.indexOf("img/")) : null;
              img.src = relativePath || p.url;
            }
          });
        }

        setAssets(loadedAssets);
      };

      // クラウド読込
      const loadFromCloud = (roomName) => {
        showStatus("サーバーから読込中...", "#ff9500", 0);
        fetch(`${API_ENDPOINT}?room=${encodeURIComponent(roomName)}`)
          .then((res) => res.text())
          .then((text) => {
            if (text && text.trim() !== "") {
              const d = JSON.parse(LZString.decompressFromEncodedURIComponent(text));
              setMap(d.m || []);
              setLines(d.l || []);
              showStatus("同期完了", "#34c759");
            } else {
              showStatus("新規データです", "#007aff");
              loadLocalData();
            }
          })
          .catch((err) => {
            console.error("Load cloud error:", err);
            showStatus("読込失敗しました", "#ff3b30");
            loadLocalData();
          });
      };

      // クラウド保存
      const saveToCloud = () => {
        let room = currentRoomName;
        if (!room) {
          const inputName = prompt("部屋名を入力してください（例: orange）");
          if (!inputName || inputName.trim() === "") return;
          room = inputName.trim();
          setCurrentRoomName(room);
          const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + "?room=" + room;
          window.history.replaceState({ path: newUrl }, "", newUrl);
        }

        setSelIdx(-1);
        lockedIdRef.current = null;
        showStatus("保存中...", "#ff9500", 0);

        const rawStr = JSON.stringify({ m: map, l: lines });
        const compressedStr = LZString.compressToEncodedURIComponent(rawStr);

        fetch(API_ENDPOINT, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ room, str: compressedStr })
        })
          .then(() => {
            showStatus("保存完了しました！", "#34c759");
            saveLocalData(room);
          })
          .catch((err) => {
            console.error("Save cloud error:", err);
            showStatus("保存エラー", "#ff3b30");
            alert("サーバー保存に失敗しました。ローカルに保存します。");
            saveLocalData(room);
          });
      };

      // ローカル保存
      const saveLocalData = (roomName) => {
        const key = roomName ? `map_${roomName}` : "map_v293";
        localStorage.setItem(key, JSON.stringify({ m: map, l: lines }));
      };

      // ローカル読込
      const loadLocalData = () => {
        const key = currentRoomName ? `map_${currentRoomName}` : "map_v293";
        const s = localStorage.getItem(key);
        if (s) {
          try {
            const d = JSON.parse(s);
            setMap(d.m || []);
            setLines(d.l || []);
          } catch (e) {
            console.error("Local load error:", e);
          }
        }
      };

      // 新オリジナル画像追加
      const handleFiles = (files) => {
        if (isEditLocked || !files) return;
        for (let i = 0; i < files.length; i++) {
          const f = files[i];
          const reader = new FileReader();
          reader.onload = (e) => {
            if (!e.target?.result) return;
            const img = new Image();
            img.onload = () => {
              const src = cropImage(img);
              const i2 = new Image();
              i2.onload = () => {
                setAssets(prev => {
                  const next = [
                    ...prev,
                    {
                      img: i2,
                      src,
                      name: null,
                      defS: 1,
                      defO: 0,
                      gw: 1,
                      gh: 1,
                      ox: 0,
                      oy: 0
                    }
                  ];
                  // 新素材を追加したら即それにする
                  setTimeout(() => {
                    setActiveAsset(next.length - 1);
                    setTempAssetStore(next.length - 1);
                    setSelIdx(-1);
                    lockedIdRef.current = null;
                    setMode("move");
                    setShowAssetOverlay(false);
                  }, 150);
                  return next;
                });
              };
              i2.src = src;
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(f);
        }
      };

      // 基準座標マッピング保存
      const handleRegisterMapping = () => {
        const x0Val = parseFloat(coordInput.aX);
        const y0Val = parseFloat(coordInput.aY);
        const x1Val = parseFloat(coordInput.bX);
        const y1Val = parseFloat(coordInput.bY);
        const x2Val = parseFloat(coordInput.cX);
        const y2Val = parseFloat(coordInput.cY);

        if (isNaN(x0Val) || isNaN(y0Val) || isNaN(x1Val) || isNaN(y1Val) || isNaN(x2Val) || isNaN(y2Val)) {
          alert("すべての座標に半角数値を入力してください。");
          return;
        }

        const newMapping = {
          refGx: coordMapping.refGx,
          refGy: coordMapping.refGy,
          x0: x0Val,
          y0: y0Val,
          x1: x1Val,
          y1: y1Val,
          x2: x2Val,
          y2: y2Val,
          isValid: true
        };

        setCoordMapping(newMapping);
        localStorage.setItem("coord_mapping_v1", JSON.stringify(newMapping));
        setIsCoordSettingMode(false);
        showToast("基準座標を登録し、等角マップ全体の自動計算を有効化しました！");
      };

      // 選択解除
      const deselect = () => {
        setActiveAsset(-1);
        setTempAssetStore(-1);
        setSelIdx(-1);
        lockedIdRef.current = null;
        setSelectedGrid(null);
      };

      // カメラを対象建物へ
      const jumpToMember = (id) => {
        const d = map.find((item) => item.id === id);
        if (!d || !canvasRef.current) return;
        const a = assets[d.aIdx];
        const gw = a ? a.gw : 1;
        const gh = a ? a.gh : 1;
        const refX = d.x + gw - 1;
        const refY = d.y + gh - 1;
        const pos = toS(refX, refY);
        camRef.current.x = canvasRef.current.width / 2 - pos.x * camRef.current.z;
        camRef.current.y = canvasRef.current.height / 2 - pos.y * camRef.current.z;
        
        const idx = map.findIndex((item) => item.id === id);
        setSelIdx(idx);
        setSelectedGrid({ gx: refX, gy: refY });
        setShowMemOverlay(false);
      };

      // メンバー名更新
      const updateMemberName = (val) => {
        if (isEditLocked) return;
        if (selIdx !== -1) {
          setMap((prev) => {
            const next = [...prev];
            next[selIdx] = { ...next[selIdx], mem: val };
            return next;
          });
          saveLocalData();
        }
      };

      // スライド操作反映
      const updateItemScale = (scale) => {
        if (isEditLocked || selIdx === -1) return;
        setMap((prev) => {
          const next = [...prev];
          next[selIdx] = { ...next[selIdx], s: parseFloat(scale.toFixed(2)) };
          return next;
        });
      };

      const updateItemOffset = (offset) => {
        if (isEditLocked || selIdx === -1) return;
        setMap((prev) => {
          const next = [...prev];
          next[selIdx] = { ...next[selIdx], off: offset };
          return next;
        });
      };

      const adjScale = (v) => {
        if (isEditLocked || selIdx === -1) return;
        const currentItem = map[selIdx];
        const newS = Math.max(0.1, parseFloat((currentItem.s + v).toFixed(2)));
        updateItemScale(newS);
        saveLocalData();
      };

      const adjOffset = (v) => {
        if (isEditLocked || selIdx === -1) return;
        const currentItem = map[selIdx];
        const newO = currentItem.off + v;
        updateItemOffset(newO);
        saveLocalData();
      };

      const adjNudge = (dx, dy) => {
        if (isEditLocked || selIdx === -1) return;
        setMap((prev) => {
          const next = [...prev];
          next[selIdx] = {
            ...next[selIdx],
            ox: parseFloat((next[selIdx].ox + dx).toFixed(2)),
            oy: parseFloat((next[selIdx].oy + dy).toFixed(2))
          };
          return next;
        });
        saveLocalData();
      };

      // マップ全初期化
      const handleClearAll = () => {
        if (isEditLocked) return;
        if (clearClickCount === 0) {
          setClearClickCount(1);
          setTimeout(() => setClearClickCount(0), 4000);
        } else {
          setMap([]);
          setLines([]);
          setSelIdx(-1);
          lockedIdRef.current = null;
          setClearClickCount(0);
          showToast("すべての配置をクリアしました");
          saveLocalData();
        }
      };

      // コピー動作
      const handleCopyGridCoords = (gx, gy) => {
        const coords = getGameCoords(gx, gy);
        if (!coords) {
          showToast("先に基準点の座標を登録してください");
          return;
        }
        const txt = `${coords.x}:${coords.y}`;
        navigator.clipboard.writeText(txt)
          .then(() => {
            showToast(`座標 ${txt} をコピーしました！`);
          })
          .catch((err) => {
            console.error("Clipboard copy error:", err);
            // fallback inside iframe
            const el = document.createElement('textarea');
            el.value = txt;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            showToast(`座標 ${txt} をコピーしました (FB)`);
          });
      };

      // クォータービュー座標・画面座標変換公式
      const toS = (gx, gy) => ({
        x: (gx - gy) * (T_W / 2),
        y: (gx + gy) * (T_H / 2)
      });

      const toG = (sx, sy) => {
        const x = (sx - camRef.current.x) / camRef.current.z;
        const y = (sy - camRef.current.y) / camRef.current.z;
        const gy = (y / (T_H / 2) - x / (T_W / 2)) / 2;
        return {
          x: x / (T_W / 2) + gy,
          y: gy
        };
      };

      // 重複判定
      const isBlocked = (gx, gy, gw, gh, ignoreId = null) => {
        for (let x = gx; x < gx + gw; x++) {
          for (let y = gy; y < gy + gh; y++) {
            if (map.some((d) => d.id !== ignoreId && x >= Math.round(d.x) && x < Math.round(d.x) + assets[d.aIdx].gw && y >= Math.round(d.y) && y < Math.round(d.y) + assets[d.aIdx].gh)) {
              return true;
            }
          }
        }
        return false;
      };

      // Canvasリサイズ
      useEffect(() => {
        const cvs = canvasRef.current;
        if (!cvs) return;
        const parent = cvs.parentElement;
        if (!parent) return;

        const resizeObserver = new ResizeObserver((entries) => {
          for (const entry of entries) {
            const { width: nw, height: nh } = entry.contentRect;
            
            if (nw > 0 && nh > 0) {
              if (cvs.width !== nw || cvs.height !== nh) {
                if (cvs.width > 0) {
                  camRef.current.x += (nw - cvs.width) / 2;
                  camRef.current.y += (nh - cvs.height) / 2;
                } else {
                  camRef.current.x = nw / 2;
                  camRef.current.y = nh / 3;
                }
                cvs.width = nw;
                cvs.height = nh;
                drawMap();
              }
            }
          }
        });

        resizeObserver.observe(parent);

        // 初回初期サイズ設定
        const iw = parent.clientWidth;
        const ih = parent.clientHeight;
        if (iw > 0 && ih > 0) {
          cvs.width = iw;
          cvs.height = ih;
          camRef.current.x = iw / 2;
          camRef.current.y = ih / 3;
        }

        return () => {
          resizeObserver.disconnect();
        };
      }, [assets]);

      // 描画
      const drawMap = () => {
        const cvs = canvasRef.current;
        if (!cvs) return;
        const ctx = cvs.getContext("2d");
        if (!ctx) return;

        ctx.clearRect(0, 0, cvs.width, cvs.height);
        ctx.save();
        ctx.translate(camRef.current.x, camRef.current.y);
        ctx.scale(camRef.current.z, camRef.current.z);

        // 1. グリッドの描画
        ctx.strokeStyle = "rgba(0,0,0,0.08)";
        ctx.lineWidth = 1 / camRef.current.z;
        for (let i = -20; i <= 40; i++) {
          let s = toS(i, -20);
          let e = toS(i, 40);
          ctx.beginPath();
          ctx.moveTo(s.x, s.y);
          ctx.lineTo(e.x, e.y);
          ctx.stroke();

          s = toS(-20, i);
          e = toS(40, i);
          ctx.beginPath();
          ctx.moveTo(s.x, s.y);
          ctx.lineTo(e.x, e.y);
          ctx.stroke();
        }

        // 2. 特殊領地の描画
        map.forEach((d) => {
          const a = assets[d.aIdx];
          if (!a) return;
          if (a.name === "OP") {
            drawTerritory(ctx, Math.round(d.x), Math.round(d.y), 5, "rgba(0, 122, 255, 0.12)");
          } else if (a.name === "DOOM") {
            drawTerritory(ctx, Math.round(d.x) + 1, Math.round(d.y) + 1, 6, "rgba(0, 122, 255, 0.12)");
          }
        });

        // 3. ルート線 (赤) の描画
        lines.forEach((l) => {
          ctx.beginPath();
          ctx.strokeStyle = "rgba(255,0,0,0.6)";
          ctx.lineWidth = 4 / camRef.current.z;
          const s = toS(l.x1, l.y1);
          const e = toS(l.x2, l.y2);
          ctx.moveTo(s.x, s.y);
          ctx.lineTo(e.x, e.y);
          ctx.stroke();
        });

        // 4. 配置済み建物のソート・描画
        const sorted = [...map].sort(
          (a, b) => (Math.round(a.x) + Math.round(a.y)) - (Math.round(b.x) + Math.round(b.y))
        );

        sorted.forEach((d) => {
          const a = assets[d.aIdx];
          if (!a) return;
          const w = T_W * d.s;
          const h = (a.img.height / a.img.width) * w;
          const anchor = toS(d.x + a.gw + d.ox, d.y + a.gh + d.oy);

          ctx.save();
          ctx.drawImage(a.img, anchor.x - w / 2, anchor.y - h + d.off, w, h);
          ctx.restore();

          const isSelected = selIdx !== -1 && map[selIdx]?.id === d.id;
          if (lockedIdRef.current === d.id || isSelected) {
            ctx.strokeStyle = "#007aff";
            ctx.lineWidth = (lockedIdRef.current === d.id ? 1 : 3) / camRef.current.z;
            const gx = Math.round(d.x);
            const gy = Math.round(d.y);
            const pS = toS(gx + a.gw, gy + a.gh);
            const pW = toS(gx, gy + a.gh);
            const pE = toS(gx + a.gw, gy);
            const pN = toS(gx, gy);

            ctx.beginPath();
            ctx.moveTo(pS.x, pS.y);
            ctx.lineTo(pW.x, pW.y);
            ctx.lineTo(pN.x, pN.y);
            ctx.lineTo(pE.x, pE.y);
            ctx.closePath();
            ctx.stroke();
          }
        });

        // 5. ギルメン名のバッジテキスト描画
        sorted.forEach((d) => {
          if (!d.mem) return;
          const a = assets[d.aIdx];
          if (!a) return;
          ctx.save();
          const fVal = 9.5 * d.s;
          const pVal = 3.2 * d.s;
          const rVal = 2.2 * d.s;
          ctx.font = `bold ${fVal}px sans-serif`;
          const pos = toS(d.x + a.gw / 2, d.y + a.gh / 2);
          const txtW = ctx.measureText(d.mem).width;
          const bgW = txtW + pVal * 2;
          const bgH = fVal + pVal;

          ctx.fillStyle = "rgba(0,0,0,0.8)";
          ctx.beginPath();
          ctx.roundRect(pos.x - bgW / 2, pos.y - bgH / 2, bgW, bgH, rVal);
          ctx.fill();

          ctx.fillStyle = "#fff";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(d.mem, pos.x, pos.y);
          ctx.restore();
        });

        // 6. ペンルート可視化
        if (mode === "pen" && penStartRef.current && penCurrentRef.current) {
          ctx.beginPath();
          ctx.setLineDash([6 / camRef.current.z, 3 / camRef.current.z]);
          ctx.strokeStyle = "rgba(255,0,0,0.8)";
          ctx.lineWidth = 2 / camRef.current.z;
          const s = toS(penStartRef.current.x, penStartRef.current.y);
          const e = toS(penCurrentRef.current.x, penCurrentRef.current.y);
          ctx.moveTo(s.x, s.y);
          ctx.lineTo(e.x, e.y);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        // 7. 選択中マスの強調
        if (selectedGrid) {
          const { gx, gy } = selectedGrid;
          ctx.strokeStyle = "#ff3b30";
          ctx.lineWidth = 2 / camRef.current.z;
          const pS = toS(gx + 1, gy + 1);
          const pW = toS(gx, gy + 1);
          const pE = toS(gx + 1, gy);
          const pN = toS(gx, gy);

          ctx.beginPath();
          ctx.moveTo(pS.x, pS.y);
          ctx.lineTo(pW.x, pW.y);
          ctx.lineTo(pN.x, pN.y);
          ctx.lineTo(pE.x, pE.y);
          ctx.closePath();
          ctx.stroke();

          ctx.fillStyle = "#ff3b30";
          const pinCenter = toS(gx + 0.5, gy + 0.5);
          ctx.beginPath();
          ctx.arc(pinCenter.x, pinCenter.y - 12 / camRef.current.z, 5 / camRef.current.z, 0, Math.PI * 2);
          ctx.fill();
        }

        // 8. 座標設定用の基準点(L字型に連なった3マス)の描画
        if (isCoordSettingMode) {
          const rx = coordMapping.refGx;
          const ry = coordMapping.refGy;

          ctx.restore();
          ctx.save();
          ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
          ctx.fillRect(0, 0, cvs.width, cvs.height);
          
          ctx.translate(camRef.current.x, camRef.current.y);
          ctx.scale(camRef.current.z, camRef.current.z);

          const drawDiamond = (gx, gy, label) => {
            const pS = toS(gx + 1, gy + 1);
            const pW = toS(gx, gy + 1);
            const pE = toS(gx + 1, gy);
            const pN = toS(gx, gy);

            ctx.fillStyle = "rgba(255, 149, 0, 0.35)";
            ctx.beginPath();
            ctx.moveTo(pS.x, pS.y);
            ctx.lineTo(pW.x, pW.y);
            ctx.lineTo(pN.x, pN.y);
            ctx.lineTo(pE.x, pE.y);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = "#ff9500";
            ctx.lineWidth = 3 / camRef.current.z;
            ctx.stroke();

            ctx.save();
            ctx.font = `bold ${14 / camRef.current.z}px sans-serif`;
            const cent = toS(gx + 0.5, gy + 0.5);
            ctx.fillStyle = "#ffffff";
            ctx.shadowColor = "#ff9500";
            ctx.shadowBlur = 8;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(label, cent.x, cent.y);
            ctx.restore();
          };

          drawDiamond(rx, ry, "A");
          drawDiamond(rx + 1, ry, "B");
          drawDiamond(rx, ry + 1, "C");

          ctx.strokeStyle = "rgba(255,149,0,0.5)";
          ctx.setLineDash([4 / camRef.current.z, 4 / camRef.current.z]);
          ctx.lineWidth = 1.5 / camRef.current.z;
          ctx.beginPath();
          const pA = toS(rx + 0.5, ry + 0.5);
          const pB = toS(rx + 1.5, ry + 0.5);
          const pC = toS(rx + 0.5, ry + 1.5);
          ctx.moveTo(pB.x, pB.y);
          ctx.lineTo(pA.x, pA.y);
          ctx.lineTo(pC.x, pC.y);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        ctx.restore();
      };

      const drawTerritory = (ctx, gx, gy, range, color) => {
        ctx.fillStyle = color;
        ctx.beginPath();
        const p1 = toS(gx - range, gy - range);
        const p2 = toS(gx + range + 1, gy - range);
        const p3 = toS(gx + range + 1, gy + range + 1);
        const p4 = toS(gx - range, gy + range + 1);
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.lineTo(p3.x, p3.y);
        ctx.lineTo(p4.x, p4.y);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = "rgba(0,122,255,0.3)";
        ctx.lineWidth = 1 / camRef.current.z;
        ctx.stroke();
      };

      // 依存更新
      useEffect(() => {
        drawMap();
      }, [map, lines, selIdx, activeAsset, selectedGrid, coordMapping, isCoordSettingMode, assets]);

      const zoom = (scaleChange, centerX, centerY) => {
        const newZ = Math.min(Math.max(camRef.current.z * scaleChange, 0.1), 5);
        const ratio = newZ / camRef.current.z;
        camRef.current.x = centerX - (centerX - camRef.current.x) * ratio;
        camRef.current.y = centerY - (centerY - camRef.current.y) * ratio;
        camRef.current.z = newZ;
        drawMap();
      };

      // 操作
      const handleStart = (clientX, clientY) => {
        if (guideMode) return;
        const rect = canvasRef.current?.getBoundingClientRect();
        if (!rect) return;
        const canvasX = clientX - rect.left;
        const canvasY = clientY - rect.top;

        const rawG = toG(clientX, clientY);
        const gx_o = Math.floor(rawG.x);
        const gy_o = Math.floor(rawG.y);
        const gx_p = Math.round(rawG.x);
        const gy_p = Math.round(rawG.y);

        if (isCoordSettingMode) {
          const rx = coordMapping.refGx;
          const ry = coordMapping.refGy;
          const isTouchA = gx_o === rx && gy_o === ry;
          const isTouchB = gx_o === rx + 1 && gy_o === ry;
          const isTouchC = gx_o === rx && gy_o === ry + 1;

          if (isTouchA || isTouchB || isTouchC) {
            isDraggingCoordRef.current = true;
            return;
          }
          
          setCoordMapping(prev => ({ ...prev, refGx: gx_o, refGy: gy_o }));
          isDraggingCoordRef.current = true;
          return;
        }

        if (isEditLocked) {
          setSelIdx(-1);
          lockedIdRef.current = null;
          dragRef.current = true;
          setSelectedGrid({ gx: gx_o, gy: gy_o });
          drawMap();
          return;
        }

        if (mode === "pen") {
          penStartRef.current = { x: gx_p, y: gy_p };
          penCurrentRef.current = { x: gx_p, y: gy_p };
          drawMap();
          return;
        }

        if (mode === "p-erase") {
          const distToSeg = (p, v, w) => {
            const l2 = Math.pow(v.x - w.x, 2) + Math.pow(v.y - w.y, 2);
            if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
            let t = Math.max(0, Math.min(1, ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2));
            return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
          };

          setLines((prev) => prev.filter((l) => distToSeg(rawG, { x: l.x1, y: l.y1 }, { x: l.x2, y: l.y2 }) > 0.5));
          saveLocalData();
          drawMap();
          return;
        }

        let hitIdx = map.findLastIndex((d) => {
          const a = assets[d.aIdx];
          return a && rawG.x >= d.x && rawG.x < d.x + a.gw && rawG.y >= d.y && rawG.y < d.y + a.gh;
        });

        if (mode === "erase" && hitIdx !== -1) {
          setMap((prev) => {
            const next = [...prev];
            next.splice(hitIdx, 1);
            return next;
          });
          setSelIdx(-1);
          saveLocalData();
          setSelectedGrid(null);
          drawMap();
          return;
        }

        if (mode === "move") {
          if (hitIdx !== -1) {
            if (activeAsset !== -1) {
              setTempAssetStore(activeAsset);
            }
            setActiveAsset(-1);
            setSelIdx(hitIdx);
            lockedIdRef.current = map[hitIdx].id;
            const d = map[hitIdx];
            const a = assets[d.aIdx];
            const refX = Math.round(d.x) + (a ? a.gw - 1 : 0);
            const refY = Math.round(d.y) + (a ? a.gh - 1 : 0);
            setSelectedGrid({ gx: refX, gy: refY });
            drawMap();
            return;
          }

          if (activeAsset === -1 && tempAssetStore !== -1) {
            setActiveAsset(tempAssetStore);
          }

          if (activeAsset !== -1) {
            const a = assets[activeAsset];
            if (!a) return;
            if (isBlocked(gx_o, gy_o, a.gw, a.gh)) {
              showToast("他の建物と重複するスペースには配置できません");
              return;
            }
            const newItem = {
              id: Date.now() + "_" + Math.random().toString(36).substr(2, 9),
              aIdx: activeAsset,
              x: gx_o,
              y: gy_o,
              s: a.defS,
              off: a.defO,
              mem: "",
              ox: a.ox,
              oy: a.oy
            };
            setMap((prev) => [...prev, newItem]);
            setSelIdx(map.length);
            lockedIdRef.current = newItem.id;
            setSelectedGrid({ gx: gx_o + a.gw - 1, gy: gy_o + a.gh - 1 });
            saveLocalData();
            drawMap();
            return;
          }

          setSelIdx(-1);
          lockedIdRef.current = null;
          setSelectedGrid({ gx: gx_o, gy: gy_o });
          dragRef.current = true;
          drawMap();
        }
      };

      const handleMove = (clientX, clientY) => {
        if (isCoordSettingMode && isDraggingCoordRef.current) {
          const rawG = toG(clientX, clientY);
          const gx_o = Math.floor(rawG.x);
          const gy_o = Math.floor(rawG.y);
          setCoordMapping(prev => ({ ...prev, refGx: gx_o, refGy: gy_o }));
          return;
        }

        if (isEditLocked) {
          if (dragRef.current) {
            camRef.current.x += clientX - lastTRef.current.x;
            camRef.current.y += clientY - lastTRef.current.y;
            drawMap();
          }
          lastTRef.current = { x: clientX, y: clientY };
          return;
        }

        const rawG = toG(clientX, clientY);
        const gx_o = Math.floor(rawG.x);
        const gy_o = Math.floor(rawG.y);
        const gx_p = Math.round(rawG.x);
        const gy_p = Math.round(rawG.y);

        if (mode === "pen" && penStartRef.current) {
          penCurrentRef.current = { x: gx_p, y: gy_p };
          drawMap();
          return;
        }

        if (dragRef.current) {
          camRef.current.x += clientX - lastTRef.current.x;
          camRef.current.y += clientY - lastTRef.current.y;
          drawMap();
        } else if (selIdx !== -1 && mode === "move" && lockedIdRef.current) {
          const itemIdx = map.findIndex((item) => item.id === lockedIdRef.current);
          if (itemIdx !== -1) {
            const a = assets[map[itemIdx].aIdx];
            if (a) {
              const prevX = map[itemIdx].x;
              const prevY = map[itemIdx].y;
              if (prevX !== gx_o || prevY !== gy_o) {
                if (!isBlocked(gx_o, gy_o, a.gw, a.gh, lockedIdRef.current)) {
                  setMap((prev) => {
                    const next = [...prev];
                    next[itemIdx] = { ...next[itemIdx], x: gx_o, y: gy_o };
                    return next;
                  });
                  setSelectedGrid({ gx: gx_o + a.gw - 1, gy: gy_o + a.gh - 1 });
                  saveLocalData();
                }
              }
            }
          }
        }
        lastTRef.current = { x: clientX, y: clientY };
      };

      const handleEnd = () => {
        if (isCoordSettingMode) {
          isDraggingCoordRef.current = false;
          return;
        }

        if (mode === "pen" && penStartRef.current && penCurrentRef.current) {
          const s = penStartRef.current;
          const e = penCurrentRef.current;
          if (s.x !== e.x || s.y !== e.y) {
            setLines((prev) => [...prev, { x1: s.x, y1: s.y, x2: e.x, y2: e.y }]);
            saveLocalData();
          }
        }
        dragRef.current = false;
        penStartRef.current = null;
        penCurrentRef.current = null;
        drawMap();
      };

      // マウスイベント
      const onMouseDown = (e) => {
        if (e.button !== 0) return;
        lastTRef.current = { x: e.clientX, y: e.clientY };
        handleStart(e.clientX, e.clientY);
      };

      const onMouseMove = (e) => {
        handleMove(e.clientX, e.clientY);
      };

      const onMouseUp = () => {
        handleEnd();
      };

      // タッチイベント (マルチタッチピンチズーム対応)
      const onTouchStart = (e) => {
        const t = e.touches;
        if (t.length === 1) {
          lastTRef.current = { x: t[0].clientX, y: t[0].clientY };
          handleStart(t[0].clientX, t[0].clientY);
        } else if (t.length === 2) {
          pinchRef.current = true;
          dragRef.current = false;
          penStartRef.current = null;
          penCurrentRef.current = null;
          const dx = t[0].clientX - t[1].clientX;
          const dy = t[0].clientY - t[1].clientY;
          lastDistRef.current = Math.hypot(dx, dy);
          lastTRef.current = {
            x: (t[0].clientX + t[1].clientX) / 2,
            y: (t[0].clientY + t[1].clientY) / 2
          };
        }
      };

      const onTouchMove = (e) => {
        const t = e.touches;
        if (t.length === 1 && !pinchRef.current) {
          handleMove(t[0].clientX, t[0].clientY);
        } else if (t.length === 2 && pinchRef.current) {
          const dx = t[0].clientX - t[1].clientX;
          const dy = t[0].clientY - t[1].clientY;
          const dist = Math.hypot(dx, dy);
          const cx = (t[0].clientX + t[1].clientX) / 2;
          const cy = (t[0].clientY + t[1].clientY) / 2;

          const scaleChange = dist / lastDistRef.current;
          zoom(scaleChange, cx, cy);

          // カメラドラッグも並行処理
          camRef.current.x += cx - lastTRef.current.x;
          camRef.current.y += cy - lastTRef.current.y;

          lastDistRef.current = dist;
          lastTRef.current = { x: cx, y: cy };
          drawMap();
        }
      };

      const onTouchEnd = (e) => {
        if (e.touches.length === 0) {
          pinchRef.current = false;
          handleEnd();
        }
      };

      // ホイールズーム
      const onWheel = (e) => {
        e.preventDefault();
        const rect = canvasRef.current?.getBoundingClientRect();
        if (!rect) return;
        const cx = e.clientX - rect.left;
        const cy = e.clientY - rect.top;
        const scaleChange = e.deltaY < 0 ? 1.15 : 1 / 1.15;
        zoom(scaleChange, cx, cy);
      };

      // 編集用簡易座標登録モードのトグル
      const toggleCoordSettingMode = () => {
        if (isCoordSettingMode) {
          setIsCoordSettingMode(false);
        } else {
          // 中央付近の等角座標を自動で拾って初期値に設定
          if (canvasRef.current) {
            const centerG = toG(canvasRef.current.width / 2, canvasRef.current.height / 2);
            const rx = Math.floor(centerG.x);
            const ry = Math.floor(centerG.y);
            setCoordMapping(prev => ({
              ...prev,
              refGx: rx,
              refGy: ry
            }));
          }
          setIsCoordSettingMode(true);
          setSelectedGrid(null);
          setSelIdx(-1);
          lockedIdRef.current = null;
          setActiveAsset(-1);
          showToast("座標登録モード: L字型の3つのマスの中心(A)を基準のマスに重ねてください");
        }
      };

      // ギルド配置図をクリアな高精細1枚画像としてエクスポート
      const exportImage = () => {
        const rawSorted = [...map].sort(
          (a, b) => (Math.round(a.x) + Math.round(a.y)) - (Math.round(b.x) + Math.round(b.y))
        );
        if (rawSorted.length === 0) {
          alert("まだ誰もマップに建物を置いていません。");
          return;
        }

        // ギルド領地の境界限界値サイズを自動計算
        let minGx = Infinity, maxGx = -Infinity, minGy = Infinity, maxGy = -Infinity;
        rawSorted.forEach(d => {
          const a = assets[d.aIdx];
          const gw = a ? a.gw : 1;
          const gh = a ? a.gh : 1;
          minGx = Math.min(minGx, Math.round(d.x));
          maxGx = Math.max(maxGx, Math.round(d.x) + gw);
          minGy = Math.min(minGy, Math.round(d.y));
          maxGy = Math.max(maxGy, Math.round(d.y) + gh);
        });

        // 描画が収まるように余白スペース(グリッドサイズ)を拡充
        const pad = 4;
        minGx -= pad; maxGx += pad;
        minGy -= pad; maxGy += pad;

        const cropW = (maxGx - minGx) * T_W;
        const cropH = (maxGy - minGy) * T_H;

        // エクスポート用のダミーオフスクリーンCanvas作成
        const tempCvs = document.createElement("canvas");
        tempCvs.width = Math.max(cropW, 1200);
        tempCvs.height = Math.max(cropH, 800);
        const tempCtx = tempCvs.getContext("2d");
        if (!tempCtx) return;

        // 背景を完全に綺麗な純白で統一
        tempCtx.fillStyle = "#ffffff";
        tempCtx.fillRect(0, 0, tempCvs.width, tempCvs.height);

        tempCtx.save();
        // オブジェクトの並びがCanvasの中心になるようにカメラ位置調整
        const centerS_X = (minGx - minGy) * (T_W / 2);
        const centerS_Y = (minGx + minGy) * (T_H / 2);
        tempCtx.translate(tempCvs.width / 2 - (centerS_X + cropW / 2), tempCvs.height / 2 - (centerS_Y + cropH / 2));

        // 1. 等角薄グリッド描画
        tempCtx.strokeStyle = "rgba(0,0,0,0.06)";
        tempCtx.lineWidth = 1;
        for (let i = minGx - 10; i <= maxGx + 10; i++) {
          let s = toS(i, minGy - 10);
          let e = toS(i, maxGy + 10);
          tempCtx.beginPath();
          tempCtx.moveTo(s.x, s.y);
          tempCtx.lineTo(e.x, e.y);
          tempCtx.stroke();

          s = toS(minGx - 10, i);
          e = toS(maxGx + 10, i);
          tempCtx.beginPath();
          tempCtx.moveTo(s.x, s.y);
          tempCtx.lineTo(e.x, e.y);
          tempCtx.stroke();
        }

        // 2. 特殊領地 (HQ / 国境関所など) 描画
        rawSorted.forEach((d) => {
          const a = assets[d.aIdx];
          if (!a) return;
          if (a.name === "OP") {
            // 関所
            tempCtx.fillStyle = "rgba(0, 122, 255, 0.1)";
            tempCtx.beginPath();
            const range = 5;
            const gx = Math.round(d.x), gy = Math.round(d.y);
            const p1 = toS(gx - range, gy - range);
            const p2 = toS(gx + range + 1, gy - range);
            const p3 = toS(gx + range + 1, gy + range + 1);
            const p4 = toS(gx - range, gy + range + 1);
            tempCtx.moveTo(p1.x, p1.y);
            tempCtx.lineTo(p2.x, p2.y);
            tempCtx.lineTo(p3.x, p3.y);
            tempCtx.lineTo(p4.x, p4.y);
            tempCtx.closePath();
            tempCtx.fill();
            tempCtx.strokeStyle = "rgba(0,122,255,0.25)";
            tempCtx.stroke();
          } else if (a.name === "DOOM") {
            // 本部
            tempCtx.fillStyle = "rgba(0, 122, 255, 0.1)";
            tempCtx.beginPath();
            const range = 6;
            const gx = Math.round(d.x) + 1, gy = Math.round(d.y) + 1;
            const p1 = toS(gx - range, gy - range);
            const p2 = toS(gx + range + 1, gy - range);
            const p3 = toS(gx + range + 1, gy + range + 1);
            const p4 = toS(gx - range, gy + range + 1);
            tempCtx.moveTo(p1.x, p1.y);
            tempCtx.lineTo(p2.x, p2.y);
            tempCtx.lineTo(p3.x, p3.y);
            tempCtx.lineTo(p4.x, p4.y);
            tempCtx.closePath();
            tempCtx.fill();
            tempCtx.strokeStyle = "rgba(0,122,255,0.25)";
            tempCtx.stroke();
          }
        });

        // 3. 建物アセット描画
        rawSorted.forEach((d) => {
          const a = assets[d.aIdx];
          if (!a) return;
          const w = T_W * d.s;
          const h = (a.img.height / a.img.width) * w;
          const anchor = toS(d.x + a.gw + d.ox, d.y + a.gh + d.oy);

          tempCtx.save();
          tempCtx.drawImage(a.img, anchor.x - w / 2, anchor.y - h + d.off, w, h);
          tempCtx.restore();
        });

        // 4. 配置ギルメンバッジ名描画
        rawSorted.forEach((d) => {
          if (!d.mem) return;
          const a = assets[d.aIdx];
          if (!a) return;
          tempCtx.save();
          const fVal = 9.5 * d.s;
          const pVal = 3.2 * d.s;
          const rVal = 2.2 * d.s;
          tempCtx.font = `bold ${fVal}px sans-serif`;
          const pos = toS(d.x + a.gw / 2, d.y + a.gh / 2);
          const txtW = tempCtx.measureText(d.mem).width;
          const bgW = txtW + pVal * 2;
          const bgH = fVal + pVal;

          tempCtx.fillStyle = "rgba(0,0,0,0.8)";
          tempCtx.beginPath();
          tempCtx.roundRect(pos.x - bgW / 2, pos.y - bgH / 2, bgW, bgH, rVal);
          tempCtx.fill();

          tempCtx.fillStyle = "#fff";
          tempCtx.textAlign = "center";
          tempCtx.textBaseline = "middle";
          tempCtx.fillText(d.mem, pos.x, pos.y);
          tempCtx.restore();
        });

        tempCtx.restore();

        // 吐き出した画像URLをポインターオーバーレイ等に格納
        try {
          const url = tempCvs.toDataURL("image/png");
          setExportImageUrl(url);
        } catch (e) {
          console.error("Export image creation failed (tainted canvas possibly):", e);
          alert("画像の書き出し出力に失敗しました。画像ホストのCORSポリシー制限、またはオリジナル素材のセキュリティ制限が要因の可能性があります。");
        }
      };

      return (
        <div id="app-container" className="fixed inset-0 flex flex-col items-center justify-start bg-slate-100 overflow-hidden font-sans select-none">
          {/* コピペ用通知 */}
          {copiedNotification && (
            <div className="fixed top-5 left-1/2 -translate-x-1/2 bg-slate-900/90 backdrop-blur-md text-white px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-2xl z-[5000] tracking-wider border border-white/10 animate-toast">
              <Check size={14} className="text-green-400" /> {copiedNotification}
            </div>
          )}

          {/* ヘッダーエリア */}
          <header className="w-full h-[54px] bg-slate-900 text-white flex items-center justify-between px-3 sm:px-4 shrink-0 shadow-lg relative z-[1000] border-b border-white/5">
            <div className="flex items-center gap-2">
              <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-md shadow-blue-500/20">
                <Icon name="map-pin" size={18} className="text-white" />
              </div>
              <div className="flex flex-col">
                <span className="text-xs sm:text-sm font-extrabold tracking-wider bg-gradient-to-r from-blue-300 to-indigo-100 bg-clip-text text-transparent">
                  MAP LAYOUT EDITOR
                </span>
                <span className="text-[9px] text-slate-400 font-bold -mt-0.5 font-mono">
                  ROOM: {currentRoomName ? `#${currentRoomName}` : "LOCAL_STANDALONE"}
                </span>
              </div>
            </div>

            {/* ガイドモード説明ラベル */}
            {guideMode && (
              <div className="absolute top-[62px] left-1/2 -translate-x-1/2 w-[90%] max-w-sm bg-blue-600 text-white p-3 rounded-xl text-xs font-bold shadow-2xl z-[4500] border border-blue-400/30 flex items-center gap-2 leading-relaxed animate-guide">
                <HelpCircle size={16} className="shrink-0 text-blue-100" />
                <span>{guideText}</span>
              </div>
            )}

            <div className="flex items-center gap-1.5">
              <button 
                onClick={toggleGuideMode}
                className={`h-7 px-2.5 rounded-lg text-[10px] sm:text-xs font-bold flex items-center gap-1 shadow transition-all cursor-pointer ${guideMode ? "bg-amber-500 text-white hover:bg-amber-600 ring-2 ring-amber-300" : "bg-slate-800 text-slate-300 hover:bg-slate-700/80 hover:text-white"}`}
              >
                <HelpCircle size={14} /> ガイド
              </button>
              <button 
                onClick={() => setShowMemOverlay(true)}
                className="h-7 px-2.5 bg-slate-800 text-slate-300 hover:bg-slate-700/80 hover:text-white font-bold rounded-lg text-[10px] sm:text-xs flex items-center gap-1 shadow transition-all cursor-pointer"
                onClickCapture={(e) => handleGuideClick('名簿', e)}
              >
                <Users size={14} /> 名簿 ({map.filter(d => d.mem && d.mem.trim() !== "").length})
              </button>
            </div>
          </header>

          {/* メイン ビューエリア */}
          <div className="flex-1 w-full relative bg-slate-200">
            <canvas 
              ref={canvasRef} 
              onMouseDown={onMouseDown}
              onMouseMove={onMouseMove}
              onMouseUp={onMouseUp}
              onMouseLeave={onMouseUp}
              onTouchStart={onTouchStart}
              onTouchMove={onTouchMove}
              onTouchEnd={onTouchEnd}
              onWheel={onWheel}
              className="absolute inset-0 w-full h-full block cursor-grab active:cursor-grabbing touch-none"
            />

            {/* サーバーステータスインジケータ */}
            {syncStatus && (
              <div 
                className="absolute top-3 left-3 px-2.5 py-1 rounded-full text-[9px] font-bold text-white shadow-md flex items-center gap-1.5 transition-all animate-toast z-[500]"
                style={{ backgroundColor: syncStatus.color }}
              >
                <span className="w-1.5 h-1.5 bg-white rounded-full animate-ping" />
                {syncStatus.text}
              </div>
            )}

            {/* 簡易スケール/カメラリセット UI */}
            <div className="absolute right-3 top-3 flex flex-col gap-1 z-[500] pointer-events-none">
              <button 
                onClick={() => {
                  if (canvasRef.current) {
                    camRef.current.x = canvasRef.current.width / 2;
                    camRef.current.y = canvasRef.current.height / 3;
                    camRef.current.z = 1;
                    drawMap();
                  }
                }}
                className="w-8 h-8 bg-white/90 hover:bg-white text-slate-800 hover:text-[#007aff] border border-gray-300/60 rounded-xl shadow-lg flex items-center justify-center active:scale-95 transition-all pointer-events-auto cursor-pointer"
                title="表示位置を戻す"
              >
                <RotateCcw size={15} />
              </button>
              <button 
                onClick={() => deselect()}
                className="w-8 h-8 bg-white/90 hover:bg-white text-slate-800 hover:text-amber-500 border border-gray-300/60 rounded-xl shadow-lg flex items-center justify-center active:scale-95 transition-all pointer-events-auto cursor-pointer"
                title="選択をクリア"
                onClickCapture={(e) => handleGuideClick('選択解除', e)}
              >
                <Grid size={15} />
              </button>
              <button 
                onClick={handleClearAll}
                className={`w-8 h-8 border rounded-xl shadow-lg flex items-center justify-center active:scale-95 transition-all pointer-events-auto cursor-pointer ${clearClickCount === 1 ? "bg-red-500 text-white border-red-500 animate-pulse" : "bg-white/90 border-gray-300/60 text-red-500 hover:bg-red-50"}`}
                title="全要素を画面から消去"
                onClickCapture={(e) => handleGuideClick('全消去', e)}
              >
                <Trash2 size={15} />
              </button>
            </div>
          </div>

          {/* 下部編集/調整パネル */}
          <div className="w-full bg-white border-t border-gray-300/80 shadow-[0_-8px_24px_rgba(0,0,0,0.06)] relative z-[1500] shrink-0 pb-safe">
            {/* 折畳トグル */}
            <button 
              onClick={() => setIsBotPanelCollapsed(!isBotPanelCollapsed)}
              className="absolute -top-[23px] left-1/2 -translate-x-1/2 px-4 h-6 bg-white border-t border-x border-gray-300/80 rounded-t-xl text-gray-500 hover:text-[#007aff] flex items-center justify-center shadow-[-4px_-4px_10px_rgba(0,0,0,0.03)] cursor-pointer select-none transition-colors active:bg-gray-50"
            >
              {isBotPanelCollapsed ? <ChevronUp size={14} className="animate-bounce" /> : <ChevronDown size={14} />}
            </button>

            <div className={`w-full max-w-lg mx-auto p-2 sm:p-3 pb-3 sm:pb-4 flex flex-col gap-2 transition-all duration-300 ${isBotPanelCollapsed ? "h-0 py-0 pb-0 overflow-hidden pointer-events-none opacity-0 border-t-0" : "h-auto opacity-100 pointer-events-auto"}`}>
              {/* アセット呼び出し ＆ メンバー名追加エリア */}
              <div className="flex gap-2 sm:gap-2.5 items-center w-full">
                {/* 建物アセット呼び出しボタン */}
                <button 
                  onClick={() => setShowAssetOverlay(true)}
                  className="h-9 sm:h-10 px-3 sm:px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 active:from-blue-800 active:to-indigo-800 text-white font-extrabold text-[10px] sm:text-xs tracking-wider rounded-xl shadow-md shadow-blue-500/10 flex items-center gap-1.5 shrink-0 transition-all cursor-pointer whitespace-nowrap"
                  onClickCapture={(e) => handleGuideClick('素材追加', e)}
                >
                  🧱 建物選択
                </button>

                {/* ギルメン名・名前登録スロット */}
                <div 
                  className="flex-1 flex gap-1 items-center bg-gray-50 border border-gray-300 rounded-xl px-2 sm:px-3 h-9 sm:h-10 focus-within:ring-2 focus-within:ring-sky-500/20 focus-within:border-[#007aff] transition-colors"
                  onClick={(e) => handleGuideClick('ギルメン名', e)}
                >
                  <span className="text-gray-400 text-xs sm:text-sm">👤</span>
                  <input 
                    type="text" 
                    placeholder={isEditLocked ? "編集保護中 (閲覧のみ)" : selIdx === -1 ? "配置物をタップして名前入力" : "配置したギルメンの名前"}
                    disabled={isEditLocked || selIdx === -1}
                    value={selIdx !== -1 && map[selIdx] ? map[selIdx].mem : ""}
                    onChange={(e) => updateMemberName(e.target.value)}
                    className="w-full bg-transparent border-none text-xs sm:text-sm font-bold text-gray-800 focus:outline-none placeholder-gray-400"
                  />
                  {selIdx !== -1 && !isEditLocked && (
                    <button 
                      onClick={() => updateMemberName("")}
                      className="text-gray-400 hover:text-gray-600 text-xs font-bold font-mono px-1 active:scale-95 transition-transform shrink-0"
                    >
                      CLEAR
                    </button>
                  )}
                </div>
              </div>

              {/* サイズ＆重なり順(接地)微調整スライダー */}
              <div 
                className="flex items-center gap-2 sm:gap-3 justify-between bg-zinc-50 border border-gray-300/70 rounded-xl px-2 sm:px-3 py-1.5 sm:py-2 select-none"
                onClick={(e) => handleGuideClick('サイズ調整', e)}
              >
                <span className="text-[10px] sm:text-xs font-bold text-gray-500 shrink-0">サイズ</span>
                <button 
                  disabled={isEditLocked || selIdx === -1}
                  onClick={() => adjScale(-0.05)}
                  className="w-8 h-7 sm:w-9 sm:h-8 text-base sm:text-lg border border-gray-300 bg-gray-50 disabled:bg-gray-100 disabled:text-gray-400 rounded-md text-[#007aff] cursor-pointer shrink-0 font-bold active:bg-gray-200 transition-colors pointer-events-auto"
                >
                  -
                </button>
                <input 
                  type="range" 
                  min="0.1" 
                  max="4" 
                  step="0.05"
                  disabled={isEditLocked || selIdx === -1}
                  value={selIdx !== -1 && map[selIdx] ? map[selIdx].s : 1}
                  onChange={(e) => updateItemScale(parseFloat(e.target.value))}
                  className="flex-1 h-7 sm:h-9 cursor-pointer accent-[#007aff]"
                />
                <button 
                  disabled={isEditLocked || selIdx === -1}
                  onClick={() => adjScale(0.05)}
                  className="w-8 h-7 sm:w-9 sm:h-8 text-base sm:text-lg border border-gray-300 bg-gray-50 disabled:bg-gray-100 disabled:text-gray-400 rounded-md text-[#007aff] cursor-pointer shrink-0 font-bold active:bg-gray-200 transition-colors pointer-events-auto"
                >
                  +
                </button>
              </div>

              <div 
                className="flex items-center gap-2 sm:gap-3 justify-between bg-zinc-50 border border-gray-300/70 rounded-xl px-2 sm:px-3 py-1.5 sm:py-2 select-none"
                onClick={(e) => handleGuideClick('接地調整', e)}
              >
                <span className="text-[10px] sm:text-xs font-bold text-gray-500 shrink-0 w-8 sm:w-auto">接地/重ね</span>
                <button 
                  disabled={isEditLocked || selIdx === -1}
                  onClick={() => adjOffset(-1)}
                  className="w-8 h-7 sm:w-9 sm:h-8 text-base sm:text-lg border border-gray-300 bg-gray-50 disabled:bg-gray-100 disabled:text-gray-400 rounded-md text-[#007aff] cursor-pointer shrink-0 font-bold active:bg-gray-200 transition-colors pointer-events-auto"
                >
                  -
                </button>
                <input 
                  type="range" 
                  min="-100" 
                  max="100" 
                  step="1"
                  disabled={isEditLocked || selIdx === -1}
                  value={selIdx !== -1 && map[selIdx] ? map[selIdx].off : 0}
                  onChange={(e) => updateItemOffset(parseInt(e.target.value))}
                  className="flex-1 h-7 sm:h-9 cursor-pointer accent-[#007aff]"
                />
                <button 
                  disabled={isEditLocked || selIdx === -1}
                  onClick={() => adjOffset(1)}
                  className="w-8 h-7 sm:w-9 sm:h-8 text-base sm:text-lg border border-gray-300 bg-gray-50 disabled:bg-gray-100 disabled:text-gray-400 rounded-md text-[#007aff] cursor-pointer shrink-0 font-bold active:bg-gray-200 transition-colors pointer-events-auto"
                >
                  +
                </button>
              </div>

              {/* 素材移動・調整とモードコントロール */}
              <div className="flex gap-2 sm:gap-2.5 w-full mt-0.5 sm:mt-1">
                {/* 微調整用 3x3 グリッド十字 */}
                <div 
                  id="nudge-grid" 
                  className="grid grid-cols-3 gap-0.5 w-[90px] sm:w-[120px] shrink-0"
                  onClick={(e) => handleGuideClick('微調整', e)}
                >
                  <div />
                  <button 
                    disabled={isEditLocked || selIdx === -1}
                    onClick={() => adjNudge(0, -0.1)}
                    className="h-7 sm:h-8 border border-gray-300 bg-white disabled:bg-gray-100 disabled:text-gray-400 active:bg-gray-100 rounded-md font-bold text-[#007aff] flex items-center justify-center cursor-pointer transition-colors"
                  >
                    <ChevronUp size={14} />
                  </button>
                  <div />
                  <button 
                    disabled={isEditLocked || selIdx === -1}
                    onClick={() => adjNudge(-0.1, 0)}
                    className="h-7 sm:h-8 border border-gray-300 bg-white disabled:bg-gray-100 disabled:text-gray-400 active:bg-gray-100 rounded-md font-bold text-[#007aff] flex items-center justify-center cursor-pointer transition-colors"
                  >
                    <ChevronLeft size={14} />
                  </button>
                  <button 
                    disabled={isEditLocked || selIdx === -1}
                    onClick={() => adjNudge(0, 0.1)}
                    className="h-7 sm:h-8 border border-gray-300 bg-white disabled:bg-gray-100 disabled:text-gray-400 active:bg-gray-100 rounded-md font-bold text-[#007aff] flex items-center justify-center cursor-pointer transition-colors"
                  >
                    <ChevronDown size={14} />
                  </button>
                  <button 
                    disabled={isEditLocked || selIdx === -1}
                    onClick={() => adjNudge(0.1, 0)}
                    className="h-7 sm:h-8 border border-gray-300 bg-white disabled:bg-gray-100 disabled:text-gray-400 active:bg-gray-100 rounded-md font-bold text-[#007aff] flex items-center justify-center cursor-pointer transition-colors"
                  >
                    <ChevronRight size={14} />
                  </button>
                </div>

                {/* モード切り替えパネル */}
                <div className="flex-1 flex flex-col gap-1 justify-start overflow-hidden">
                  {/* 任意座標登録とセーブボタン */}
                  <div className="flex gap-1 w-full">
                    <button 
                      onClick={(e) => handleGuideClick('画像保存', e) || exportImage()}
                      className="flex-1 h-7 sm:h-8 bg-green-500 hover:bg-green-600 active:bg-green-700 font-bold text-white text-[9px] sm:text-[10px] rounded-md shadow-sm transition-colors cursor-pointer text-center truncate px-0.5"
                    >
                      画像保存
                    </button>
                    <button 
                      onClick={saveToCloud}
                      className="flex-1 h-7 sm:h-8 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 font-bold text-white text-[9px] sm:text-[10px] rounded-md shadow-sm transition-colors cursor-pointer truncate px-0.5"
                    >
                      部屋保存
                    </button>
                    <button 
                      onClick={(e) => handleGuideClick('座標登録', e) || toggleCoordSettingMode()}
                      className={`flex-1 h-7 sm:h-8 font-bold text-[9px] sm:text-[10px] rounded-md shadow-sm transition-colors cursor-pointer border truncate px-0.5 ${isCoordSettingMode ? "bg-amber-500 hover:bg-amber-600 text-white border-amber-500 animate-pulse" : "bg-white hover:bg-gray-50 text-amber-600 border-amber-300"}`}
                    >
                      座標登録
                    </button>
                  </div>

                  {/* 各種のドローイングツール、閲覧・移動ツール */}
                  <div 
                    className="flex gap-0.5 sm:gap-1 items-center"
                    onClick={(e) => handleGuideClick('モード切替', e)}
                  >
                    <button 
                      onClick={toggleEditLock}
                      className={`w-7 sm:w-9 h-7 sm:h-8 rounded-md border flex items-center justify-center font-bold transition-all shadow-sm shrink-0 cursor-pointer ${isEditLocked ? "bg-amber-500 text-white border-amber-500" : "bg-white border-amber-500 text-amber-500 hover:bg-[#ff9500]/5"}`}
                      title="編集ロック/閲覧モード"
                    >
                      {isEditLocked ? <Lock size={12} /> : <Unlock size={12} />}
                    </button>

                    <button 
                      onClick={() => !isEditLocked && setMode("move")}
                      disabled={isEditLocked}
                      className={`flex-1 h-7 sm:h-8 font-bold text-[9px] sm:text-[10px] rounded-md border flex items-center justify-center gap-0.5 transition-all ${mode === "move" && !isEditLocked ? "bg-[#007aff] text-white border-[#007aff]" : "bg-white text-gray-700 border-gray-300 hover:bg-gray-50 disabled:bg-gray-100 disabled:text-gray-400"}`}
                    >
                      <Move size={11} /> <span className="hidden xs:inline">移動</span><span className="inline xs:hidden">移</span>
                    </button>

                    <button 
                      onClick={() => !isEditLocked && setMode("pen")}
                      disabled={isEditLocked}
                      className={`flex-1 h-7 sm:h-8 font-bold text-[9px] sm:text-[10px] rounded-md border flex items-center justify-center gap-0.5 transition-all ${mode === "pen" && !isEditLocked ? "bg-[#007aff] text-white border-[#007aff]" : "bg-white text-gray-700 border-gray-300 hover:bg-gray-50 disabled:bg-gray-100 disabled:text-gray-400"}`}
                    >
                      <PenTool size={11} /> <span className="hidden xs:inline">ペン</span><span className="inline xs:hidden">筆</span>
                    </button>

                    <button 
                      onClick={() => !isEditLocked && setMode("p-erase")}
                      disabled={isEditLocked}
                      className={`flex-1 h-7 sm:h-8 font-bold text-[9px] sm:text-[10px] rounded-md border flex items-center justify-center gap-0.5 transition-all ${mode === "p-erase" && !isEditLocked ? "bg-[#007aff] text-white border-[#007aff]" : "bg-white text-gray-700 border-gray-300 hover:bg-gray-50 disabled:bg-gray-100 disabled:text-gray-400"}`}
                    >
                      線消
                    </button>

                    <button 
                      onClick={() => !isEditLocked && setMode("erase")}
                      disabled={isEditLocked}
                      className={`flex-1 h-7 sm:h-8 font-bold text-[9px] sm:text-[10px] rounded-md border flex items-center justify-center gap-0.5 transition-all ${mode === "erase" && !isEditLocked ? "bg-[#007aff] text-white border-[#007aff]" : "bg-white text-gray-700 border-gray-300 hover:bg-gray-50 disabled:bg-gray-100 disabled:text-gray-400"}`}
                    >
                      <Eraser size={11} /> <span className="hidden xs:inline">建物消</span><span className="inline xs:hidden">消</span>
                    </button>
                  </div>

                  {/* 選択中のマスのゲーム内座標とコピーボタン */}
                  <div className="flex items-center justify-between gap-1 h-7 sm:h-8 bg-gray-50 border border-gray-300 rounded-md px-1.5 text-[9px] sm:text-[10px] text-gray-700 font-bold shadow-inner">
                    {selectedGrid ? (
                      <>
                        <span className="truncate flex items-center gap-0.5">
                          📍 {coordMapping.isValid ? (
                            `X:${getGameCoords(selectedGrid.gx, selectedGrid.gy)?.x}  Y:${getGameCoords(selectedGrid.gx, selectedGrid.gy)?.y}`
                          ) : (
                            `GIdx:${Math.round(selectedGrid.gx)}:${Math.round(selectedGrid.gy)}`
                          )}
                        </span>
                        {coordMapping.isValid && (
                          <button
                            onClick={() => handleCopyGridCoords(selectedGrid.gx, selectedGrid.gy)}
                            className="h-5 px-1 bg-[#007aff] hover:bg-[#007aff]/90 text-white rounded font-bold flex items-center gap-0.5 active:scale-95 transition-all text-[8px] tracking-tight shrink-0 cursor-pointer whitespace-nowrap"
                          >
                            <Copy size={9} /> コピー
                          </button>
                        )}
                      </>
                    ) : (
                      <span className="text-[8px] sm:text-[9px] text-gray-400 truncate w-full text-center font-normal">
                        タップして座標表示
                      </span>
                    )}
                  </div>
                </div>
              </div>
            </div>
          </div>

          {/* 1. 配置メンバー一覧名簿モーダル */}
          {showMemOverlay && (
            <div 
              className="fixed inset-0 bg-black/70 z-[3000] flex items-center justify-center p-4"
              onClick={() => setShowMemOverlay(false)}
            >
              <div 
                className="w-full max-w-sm bg-[#f8f9fa] rounded-2xl p-5 flex flex-col gap-4 max-h-[80vh] shadow-2xl border border-gray-200"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="flex justify-between items-center border-b-2 border-[#007aff] pb-2">
                  <h3 className="text-base font-bold text-gray-800 flex items-center gap-1.5">
                    <Users size={18} className="text-[#007aff]" /> 配置済みメンバー一覧
                  </h3>
                  <button onClick={() => setShowMemOverlay(false)} className="text-gray-500 hover:text-gray-700 font-bold text-lg">
                    ×
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto pr-1 flex flex-col gap-2 my-1">
                  {map.filter(d => d.mem && d.mem.trim() !== "").length === 0 ? (
                    <div className="text-center py-8 text-gray-400 text-sm font-medium">
                      メンバーがまだ配置されていません
                    </div>
                  ) : (
                    map
                      .filter(d => d.mem && d.mem.trim() !== "")
                      .sort((a, b) => a.mem.localeCompare(b.mem, "ja"))
                      .map((m) => (
                        <div 
                          key={m.id}
                          className="p-3 bg-white border border-gray-100 hover:border-[#007aff] rounded-lg text-sm flex justify-between items-center transition-all shadow-sm hover:shadow"
                        >
                          <span className="font-semibold text-gray-800">{m.mem}</span>
                          <button 
                            onClick={() => jumpToMember(m.id)}
                            className="text-[#007aff] font-bold text-xs cursor-pointer hover:underline px-2 py-1 bg-sky-50 rounded"
                          >
                            表示 ▶
                          </button>
                        </div>
                      ))
                  )}
                </div>
              </div>
            </div>
          )}

          {/* 2. アセット素材選択モーダル */}
          {showAssetOverlay && (
            <div 
              className="fixed inset-0 bg-black/70 z-[3000] flex items-center justify-center p-4"
              onClick={() => setShowAssetOverlay(false)}
            >
              <div 
                className="w-full max-w-md bg-[#f8f9fa] rounded-2xl p-5 flex flex-col gap-4 max-h-[80vh] shadow-2xl border border-gray-200"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="flex justify-between items-center border-b-2 border-[#007aff] pb-2">
                  <h3 className="text-base font-bold text-gray-800 flex items-center gap-1.5">
                    📦 建物素材アセット
                  </h3>
                  <button onClick={() => setShowAssetOverlay(false)} className="text-gray-500 hover:text-gray-700 font-bold text-lg">
                    ×
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto pr-1 grid grid-cols-4 gap-3 py-2">
                  <label 
                    className="aspect-square border-2 border-dashed border-gray-300 hover:border-[#007aff] bg-white rounded-xl flex flex-col justify-center items-center text-sm font-bold text-gray-400 hover:text-[#007aff] cursor-pointer transition-all hover:bg-indigo-50/20 shadow-sm"
                  >
                    <input 
                      type="file" 
                      hidden 
                      accept="image/*" 
                      multiple 
                      onChange={(e) => handleFiles(e.target.files)} 
                    />
                    <Upload size={24} className="mb-1 text-gray-300" />
                    <span className="text-[10px]">オリジナル</span>
                  </label>

                  {assets.map((a, idx) => (
                    <div 
                      key={idx}
                      onClick={() => {
                        if (isEditLocked) return;
                        setActiveAsset(idx);
                        setTempAssetStore(idx);
                        setSelIdx(-1);
                        lockedIdRef.current = null;
                        setMode("move");
