                            className="h-5 px-1 bg-[#007aff] hover:bg-[#007aff]/90 text-white rounded font-bold flex items-center gap-0.5 active:scale-95 transition-all text-[8px] tracking-tight shrink-0 cursor-pointer whitespace-nowrap"
                          >
                            <Copy size={9} /> コピー
                          </button>
                        )}
                      </>
                    ) : (
                      <span className="text-[8px] sm:text-[9px] text-gray-400 truncate w-full text-center font-normal">
                        タップして座標表示
                      </span>
                    )}
                  </div>
                </div>
              </div>
            </div>
          </div>

          {/* 1. 配置メンバー一覧名簿モーダル */}
          {showMemOverlay && (
            <div 
              className="fixed inset-0 bg-black/70 z-[3000] flex items-center justify-center p-4"
              onClick={() => setShowMemOverlay(false)}
            >
              <div 
                className="w-full max-w-sm bg-[#f8f9fa] rounded-2xl p-5 flex flex-col gap-4 max-h-[80vh] shadow-2xl border border-gray-200"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="flex justify-between items-center border-b-2 border-[#007aff] pb-2">
                  <h3 className="text-base font-bold text-gray-800 flex items-center gap-1.5">
                    <Users size={18} className="text-[#007aff]" /> 配置済みメンバー一覧
                  </h3>
                  <button onClick={() => setShowMemOverlay(false)} className="text-gray-500 hover:text-gray-700 font-bold text-lg">
                    ×
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto pr-1 flex flex-col gap-2 my-1">
                  {map.filter(d => d.mem && d.mem.trim() !== "").length === 0 ? (
                    <div className="text-center py-8 text-gray-400 text-sm font-medium">
                      メンバーがまだ配置されていません
                    </div>
                  ) : (
                    map
                      .filter(d => d.mem && d.mem.trim() !== "")
                      .sort((a, b) => a.mem.localeCompare(b.mem, "ja"))
                      .map((m) => (
                        <div 
                          key={m.id}
                          className="p-3 bg-white border border-gray-100 hover:border-[#007aff] rounded-lg text-sm flex justify-between items-center transition-all shadow-sm hover:shadow"
                        >
                          <span className="font-semibold text-gray-800">{m.mem}</span>
                          <button 
                            onClick={() => jumpToMember(m.id)}
                            className="text-[#007aff] font-bold text-xs cursor-pointer hover:underline px-2 py-1 bg-sky-50 rounded"
                          >
                            表示 ▶
                          </button>
                        </div>
                      ))
                  )}
                </div>
              </div>
            </div>
          )}

          {/* 2. アセット素材選択モーダル */}
          {showAssetOverlay && (
            <div 
              className="fixed inset-0 bg-black/70 z-[3000] flex items-center justify-center p-4"
              onClick={() => setShowAssetOverlay(false)}
            >
              <div 
                className="w-full max-w-md bg-[#f8f9fa] rounded-2xl p-5 flex flex-col gap-4 max-h-[80vh] shadow-2xl border border-gray-200"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="flex justify-between items-center border-b-2 border-[#007aff] pb-2">
                  <h3 className="text-base font-bold text-gray-800 flex items-center gap-1.5">
                    📦 建物素材アセット
                  </h3>
                  <button onClick={() => setShowAssetOverlay(false)} className="text-gray-500 hover:text-gray-700 font-bold text-lg">
                    ×
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto pr-1 grid grid-cols-4 gap-3 py-2">
                  <label 
                    className="aspect-square border-2 border-dashed border-gray-300 hover:border-[#007aff] bg-white rounded-xl flex flex-col justify-center items-center text-sm font-bold text-gray-400 hover:text-[#007aff] cursor-pointer transition-all hover:bg-indigo-50/20 shadow-sm"
                  >
                    <input 
                      type="file" 
                      hidden 
                      accept="image/*" 
                      multiple 
                      onChange={(e) => handleFiles(e.target.files)} 
                    />
                    <Upload size={24} className="mb-1 text-gray-300" />
                    <span className="text-[10px]">オリジナル</span>
                  </label>

                  {assets.map((a, idx) => (
                    <div 
                      key={idx}
                      onClick={() => {
                        if (isEditLocked) return;
                        setActiveAsset(idx);
                        setTempAssetStore(idx);
                        setSelIdx(-1);
                        lockedIdRef.current = null;
                        setMode("move");
                        setShowAssetOverlay(false);
                      }}
                      className={`aspect-square rounded-xl border bg-white bg-contain bg-no-repeat bg-center cursor-pointer transition-all hover:scale-105 shadow-sm relative ${activeAsset === idx ? "border-[#007aff] ring-2 ring-sky-300" : "border-gray-200 hover:border-[#007aff]"}`}
                      style={{ backgroundImage: `url(${a.src})` }}
                      title={a.name ? a.name : `カスタム素材 ${idx}`}
                    >
                      {a.name && (
                        <span className="absolute bottom-1 right-1 bg-black/60 text-white rounded text-[8px] px-1 scale-90 origin-bottom-right">
                          {a.name}
                        </span>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* 3. エクスポート画像オーバーレイ */}
          {exportImageUrl && (
            <div 
              className="fixed inset-0 bg-black/85 z-[4000] flex flex-col items-center justify-center p-4 cursor-pointer gap-4"
              onClick={() => setExportImageUrl(null)}
            >
              <div className="absolute top-4 right-4 text-white bg-slate-800 hover:bg-slate-700 py-1.5 px-3 rounded-full text-xs font-semibold shadow flex items-center gap-1">
                画面クリックで閉じる <X size={14} />
              </div>
              <img 
                src={exportImageUrl} 
                alt="Export" 
                className="max-w-[95%] max-h-[80vh] border-2 border-white rounded shadow-2xl object-contain"
              />
              <div className="text-white text-xs font-bold bg-black/70 px-4 py-2 rounded-lg text-center leading-normal">
                画像を長押し、または右クリックして「画像を保存」してください。<br />
                （全消去や赤線が重なっていない綺麗な配置図が出力されています）
              </div>
            </div>
          )}

          {/* 4. 座標登録設定モーダル */}
          {isCoordSettingMode && (
            <div 
              className="fixed inset-x-0 top-[75px] bottom-[235px] z-[2000] bg-transparent pointer-events-none flex flex-col items-center justify-end p-4"
            >
              <div 
                className="w-full max-w-sm bg-slate-900/98 border border-amber-600/50 backdrop-blur-md rounded-2xl p-4 shadow-2xl text-white flex flex-col gap-3 pointer-events-auto"
              >
                <div className="flex justify-between items-center border-b border-amber-500/30 pb-1.5">
                  <h4 className="text-xs font-extrabold text-amber-400 flex items-center gap-1">
                    📍 基準点(L字) 3か所の座標登録
                  </h4>
                  <button 
                    onClick={() => setIsCoordSettingMode(false)}
                    className="text-slate-400 hover:text-white"
                  >
                    <X size={16} />
                  </button>
                </div>

                <p className="text-[10px] text-slate-300 leading-normal">
                  オレンジ色の3マスセット(A, B, C)をドラッグして、ゲーム内の座標が分かっているマスに置いてください。
                  以下に各マスの「ゲーム内の本当の X:Y 座標」を入力してください。
                </p>

                <div className="flex flex-col gap-2 my-1">
                  {/* 点A */}
                  <div className="flex items-center gap-2 justify-between">
                    <span className="text-[11px] font-bold text-amber-400 w-16 shrink-0">
                      マスA (x:{coordMapping.refGx}, y:{coordMapping.refGy})
                    </span>
                    <div className="flex gap-1 flex-1">
                      <div className="flex items-center bg-slate-800 rounded px-1.5 flex-1 ring-1 ring-slate-700">
                        <span className="text-[10px] text-slate-400 mr-1 font-mono">X:</span>
                        <input 
                          type="number" 
                          value={coordInput.aX}
                          onChange={(e) => setCoordInput(prev => ({ ...prev, aX: e.target.value }))}
                          className="w-full bg-transparent border-none text-xs text-white focus:outline-none py-1 font-bold" 
                        />
                      </div>
                      <div className="flex items-center bg-slate-800 rounded px-1.5 flex-1 ring-1 ring-slate-700">
                        <span className="text-[10px] text-slate-400 mr-1 font-mono">Y:</span>
                        <input 
                          type="number" 
                          value={coordInput.aY}
                          onChange={(e) => setCoordInput(prev => ({ ...prev, aY: e.target.value }))}
                          className="w-full bg-transparent border-none text-xs text-white focus:outline-none py-1 font-bold" 
                        />
                      </div>
                    </div>
                  </div>

                  {/* 点B */}
                  <div className="flex items-center gap-2 justify-between">
                    <span className="text-[11px] font-bold text-amber-400 w-16 shrink-0">
                      マスB (x:{coordMapping.refGx + 1}, y:{coordMapping.refGy})
                    </span>
                    <div className="flex gap-1 flex-1">
                      <div className="flex items-center bg-slate-800 rounded px-1.5 flex-1 ring-1 ring-slate-700">
                        <span className="text-[10px] text-slate-400 mr-1 font-mono">X:</span>
                        <input 
                          type="number" 
                          value={coordInput.bX}
                          onChange={(e) => setCoordInput(prev => ({ ...prev, bX: e.target.value }))}
                          className="w-full bg-transparent border-none text-xs text-white focus:outline-none py-1 font-bold" 
                        />
                      </div>
                      <div className="flex items-center bg-slate-800 rounded px-1.5 flex-1 ring-1 ring-slate-700">
                        <span className="text-[10px] text-slate-400 mr-1 font-mono">Y:</span>
                        <input 
                          type="number" 
                          value={coordInput.bY}
                          onChange={(e) => setCoordInput(prev => ({ ...prev, bY: e.target.value }))}
                          className="w-full bg-transparent border-none text-xs text-white focus:outline-none py-1 font-bold" 
                        />
                      </div>
                    </div>
                  </div>

                  {/* 点C */}
                  <div className="flex items-center gap-2 justify-between">
                    <span className="text-[11px] font-bold text-amber-400 w-16 shrink-0">
                      マスC (x:{coordMapping.refGx}, y:{coordMapping.refGy + 1})
                    </span>
                    <div className="flex gap-1 flex-1">
                      <div className="flex items-center bg-slate-800 rounded px-1.5 flex-1 ring-1 ring-slate-700">
                        <span className="text-[10px] text-slate-400 mr-1 font-mono">X:</span>
                        <input 
                          type="number" 
                          value={coordInput.cX}
                          onChange={(e) => setCoordInput(prev => ({ ...prev, cX: e.target.value }))}
                          className="w-full bg-transparent border-none text-xs text-white focus:outline-none py-1 font-bold" 
                        />
                      </div>
                      <div className="flex items-center bg-slate-800 rounded px-1.5 flex-1 ring-1 ring-slate-700">
                        <span className="text-[10px] text-slate-400 mr-1 font-mono">Y:</span>
                        <input 
                          type="number" 
                          value={coordInput.cY}
                          onChange={(e) => setCoordInput(prev => ({ ...prev, cY: e.target.value }))}
                          className="w-full bg-transparent border-none text-xs text-white focus:outline-none py-1 font-bold" 
                        />
                      </div>
                    </div>
                  </div>
                </div>

                <div className="flex gap-2 w-full mt-1.5">
                  <button 
                    onClick={() => setIsCoordSettingMode(false)}
                    className="flex-1 py-2 bg-slate-800 hover:bg-slate-755 border border-slate-700 rounded-lg text-xs font-semibold text-slate-255 shadow transition-colors cursor-pointer"
                  >
                    キャンセル
                  </button>
                  <button 
                    onClick={handleRegisterMapping}
                    className="flex-[1.5] py-2 bg-amber-500 hover:bg-amber-600 rounded-lg text-xs font-bold text-white shadow shadow-amber-500/20 transition-colors cursor-pointer flex items-center justify-center gap-1"
                  >
                    登録して自動計算
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render App
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
